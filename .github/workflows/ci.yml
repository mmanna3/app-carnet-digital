name: CI

on:
  push:
  pull_request:
    # `labeled` permite disparar los E2E agregando el label "e2e" al PR
    types: [opened, synchronize, reopened, labeled]

jobs:
  ci:
    name: Validaciones estáticas
    runs-on: ubuntu-latest
    # Al agregar un label distinto de "e2e" no hace falta volver a correr nada
    if: github.event.action != 'labeled' || github.event.label.name == 'e2e'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Linter (ESLint)
        run: npm run lint

      - name: Tipos (TypeScript)
        run: npm run typecheck

      - name: Tests
        run: npm run test:ci

  count-e2e:
    name: Contar tests E2E
    needs: ci
    runs-on: ubuntu-latest
    # Corre en push a main, o en PRs que tengan el label "e2e"
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e'))
    outputs:
      count: ${{ steps.count.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: count
        run: echo "count=$(find e2e -maxdepth 1 -name '*.yaml' -type f | wc -l | tr -d ' ')" >> $GITHUB_OUTPUT

  e2e:
    name: E2E (Maestro) - ${{ needs.count-e2e.outputs.count }} tests
    needs: count-e2e
    runs-on: ubuntu-latest
    # Corre en push a main, o en PRs que tengan el label "e2e"
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e'))
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias
        run: npm ci

      - name: Prebuild (EDeFI)
        run: LIGA_ID=edefi npm run prebuild:clean

      - name: Instalar Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: E2E con emulador Android
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 5
        with:
          api-level: 32
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -writable-system -memory 4096
          script: bash e2e/run-e2e-ci.sh

      - name: Subir reporte Maestro
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-e2e-report
          path: |
            e2e-report.html
            e2e-debug/
          if-no-files-found: ignore
