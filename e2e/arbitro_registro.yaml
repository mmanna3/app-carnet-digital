appId: com.ykn.edefidelegados
name: Árbitro — registro
---
# Flujo completo de registro de árbitro: home → datos → ubicación → preferencias →
# antecedentes → completado → inicio
#
# Datos de prueba del formulario. Finalizar todavía no llama a la API: el store
# resuelve ok y muestra la pantalla de completado.
- launchApp:
    clearState: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'card-arbitros'
    timeout: 15000
- tapOn:
    id: 'card-arbitros'
# Esperar la navegación
- extendedWaitUntil:
    visible:
      id: 'input-nombre'
    timeout: 15000
# Paso datos personales (paso 1 de 4)
- tapOn:
    id: 'input-nombre'
- inputText: 'Ana'
- tapOn:
    id: 'input-apellido'
- inputText: 'Gomez'
- tapOn:
    text: 'Datos personales'
- tapOn:
    id: 'input-dni'
- inputText: '30123456'
- tapOn:
    text: 'Datos personales'
- tapOn:
    id: 'input-telefono'
- inputText: '1123456789'
# El título del paso queda fuera de pantalla con el teclado del teléfono.
# El de la cabecera sigue visible y cierra el teclado en iOS.
- tapOn:
    text: 'DNI'
- runFlow:
    when:
      platform: ios
    commands:
      - tapOn:
          text: 'Registro de árbitro'
- runFlow:
    when:
      platform: android
    commands:
      - hideKeyboard
- extendedWaitUntil:
    visible:
      id: 'boton-continuar'
      enabled: true
    timeout: 15000
- tapOn:
    id: 'boton-continuar'
# Paso ubicación y movilidad (paso 2 de 4) — fecha de nacimiento vía date picker
- extendedWaitUntil:
    visible:
      id: 'input-direccion'
    timeout: 15000
- tapOn:
    id: 'input-direccion'
- inputText: 'Calle 12 345'
- tapOn:
    text: 'Ubicación y movilidad'
- tapOn:
    id: 'input-localidad'
- inputText: 'La Plata'
- tapOn:
    text: 'Ubicación y movilidad'
- tapOn:
    id: 'input-fecha-nacimiento'
- waitForAnimationToEnd
# iOS: el Modal del date picker no expone sus elementos al árbol de accesibilidad de Maestro;
# se gira la rueda del año con swipe (dispara onChange) y se cierra con tap en "Listo" (~93% vertical)
- runFlow:
    when:
      platform: ios
    commands:
      - swipe:
          start: '75%, 70%'
          end: '75%, 50%'
          duration: 500
      - tapOn:
          point: '50%, 93%'
- runFlow:
    when:
      platform: android
    commands:
      - tapOn:
          text: 'OK'
          optional: true
      - tapOn:
          text: 'Aceptar'
          optional: true
- scrollUntilVisible:
    element:
      text: 'MOTO'
    direction: DOWN
    timeout: 10000
- tapOn:
    text: 'MOTO'
- scrollUntilVisible:
    element:
      id: 'boton-continuar'
    direction: DOWN
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'boton-continuar'
      enabled: true
    timeout: 15000
- tapOn:
    id: 'boton-continuar'
# Paso preferencias deportivas (paso 3 de 4)
- extendedWaitUntil:
    visible:
      text: 'Preferencias deportivas'
    timeout: 15000
- scrollUntilVisible:
    element:
      text: 'BABY FUTBOL'
    direction: DOWN
    timeout: 10000
- tapOn:
    text: 'BABY FUTBOL'
- scrollUntilVisible:
    element:
      text: 'SABADOS 8 A 14'
    direction: DOWN
    timeout: 10000
- tapOn:
    text: 'SABADOS 8 A 14'
- scrollUntilVisible:
    element:
      id: 'boton-continuar'
    direction: DOWN
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'boton-continuar'
      enabled: true
    timeout: 15000
- tapOn:
    id: 'boton-continuar'
# Paso antecedentes institucionales (paso 4 de 4)
- extendedWaitUntil:
    visible:
      text: 'Antecedentes institucionales'
    timeout: 15000
- tapOn:
    text: 'Sí'
- extendedWaitUntil:
    visible:
      id: 'input-institucion'
    timeout: 15000
- tapOn:
    id: 'input-institucion'
- inputText: 'Club Mock'
- tapOn:
    text: 'Antecedentes institucionales'
- runFlow:
    when:
      platform: android
    commands:
      - hideKeyboard
- scrollUntilVisible:
    element:
      id: 'boton-finalizar'
    direction: DOWN
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'boton-finalizar'
      enabled: true
    timeout: 15000
- tapOn:
    id: 'boton-finalizar'
- extendedWaitUntil:
    visible:
      id: 'pantalla-completado-arbitro'
    timeout: 15000
- tapOn:
    id: 'boton-volver-inicio-arbitro'
- extendedWaitUntil:
    visible:
      id: 'card-arbitros'
    timeout: 15000
